        <ul class="contact-list">
          <li><strong>Email</strong> <a href="mailto:juan.delacruz@email.com">juan.delacruz@email.com</a></li>

        <!-- Opens the visitor's email app (no server needed) -->

          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
